[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
minhook = "0.9"
ruzstd = { version = "0.8", default-features = false, features = ["std"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
hudhook = { version = "=0.9.3", default-features = false, features = ["dx11"] }
imgui = "=0.12.0"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
thiserror = "2"
iroh = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
data-encoding = "2"
futures-lite = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
dirs = "6"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
self-replace = "1"
ed25519-dalek = { version = "3", default-features = false }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

replicant_game = { path = "crates/replicant_game" }
nc_ui_style = { path = "crates/nc_ui_style" }
nc_wire = { path = "crates/nc_wire" }
nc_hook = { path = "crates/nc_hook" }
replicant_proto = { path = "crates/replicant_proto" }
nc_net = { path = "crates/nc_net", default-features = false }
nc_launcher_core = { path = "crates/nc_launcher_core" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
items_after_statements = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = true
codegen-units = 1
